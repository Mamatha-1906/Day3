<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>marriage registration form</title>
</head>
<style>
    label{
        font-weight:bolder;
    }
</style>

<body style="background-color: rgba(139, 169, 159, 0.527);" #fff;><center>
   <bl><u><h1>BRIDE MARRIAGE REGISTRATION FORM</h1></bl></u>
    
    <label for="full_name">Full Name:</label>
    <input type="text" full name="full_name"required><br></br>
    </div>

    <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob"required><br><br>


    <label for="height">Height:</label>
    <input type="text" full name="height"required><br></br>

     <label for="religion">Religion:</label>
        <select id="religion" name="religion"required>
            <option value="">Select Religion</option>
            <option value="hindu">Hindu</option>
            <option value="muslim">Muslim</option>
            <option value="christian">Christian</option>
            <option value="other">Other</option>
        </select><br></br>

    <label for="caste">Caste:</label>
    <input type="text" full name="caste" required><br></br>

    <label for="Education">Education:</label>
    <input type="text" full name="Education" required><br></br>

    <label for="Occupation">Occupation:</label>
    <input type="text" full name="Occupation" required><br></br>

    <label for="monthly_income">Monthly Income:</label>
    <input type="text" full name="monthly_income" required><br></br>

    <label for="Current City">Current City:</label>
    <input type="text" full name="Current city" required><br></br>

    <label for="state">State:</label>
    <input type="text" full name="state" required><br></br>

    <label for="country">Country:</label>
    <input type="text" full name="country" required><br></br>


    <div class="form-group">
                <label>Marital Status:</label>
                <input type="radio" id="single" name="maritalStatus" value="single" required>
                <label for="single">Single</label>
                <input type="radio" id="divorced" name="maritalStatus" value="divorced">
                <label for="divorced">Divorced</label>
                <input type="radio" id="widowed" name="maritalStatus" value="widowed">
                <label for="widowed">Widowed</label>
            </div><br></br>


    <label for="aboutme">About Me:</label>
    <input type="text" full name="aboutme" style="width:250px; height: 50px;"><br></br>

    <label for="hobbies">Hobbies:</label>
    <input type="text" full name="hobbies" style="width:250px; height: 50px;"><br></br>

    <label for="Partner">Partner Expectations:</label>
    <input type="text" full name="Partner" style="width:250px; height: 50px;"><br></br>

    <label for="phone no">Phone Number:</label>
    <input type="text" full name="phone no" required><br></br>

    <label for="email">Email:</label>
    <input type="text" full name="email" required><br></br>
    <label for="photo">Upload Photo:</label>
    <input type="file" full name="photo" accept="image/*"><br></br>

     <button type="submit">Submit Form</button>
     </center>
</body>
</html>
